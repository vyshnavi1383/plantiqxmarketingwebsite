services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: plantiqx-react:latest
    container_name: plantiqx-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
